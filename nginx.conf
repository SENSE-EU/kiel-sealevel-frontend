# Serves the static build only. /api, /uploads and HTTPS belong to the reverse proxy in front.
server {
  listen 8080;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

  # File names are content-hashed, so they can be cached for good.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Client-side routes such as /en/scenes/munitions. Never cached, so a deploy shows up at once.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
